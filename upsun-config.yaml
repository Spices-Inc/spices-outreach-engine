applications:
  engine:
    source:
      root: "/"
    type: "python:3.11"
    web:
      commands:
        start: "streamlit run main.py --server.port $PORT --server.address 0.0.0.0"
    mounts:
      "outputs":
        source: local
        source_path: outputs

routes:
  "https://{default}/":
    type: upstream
    upstream: "engine:http"